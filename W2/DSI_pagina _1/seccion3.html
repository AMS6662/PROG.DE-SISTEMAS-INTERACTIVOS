<!doctype html> <!--tipo de documento-->
<html> <!--indica el inicio del documento-->
	
<head> <!--inicio de cabeza de documento, en realidad no usa espacio en la pantalla, sino carga los datos de desarrollo-->
<meta charset="utf-8"/> <!--las palabras entre brackets son etiquetas, se suele usar forward-slash para terminar la linea, si la etiqueta es solo una línea-->
<title> profile </title> <!--es lo que aparece en la pestaña del navegador-->
	<style>
		nav img {margin-bottom: 16px}
		footer img {margin: 0px 50px}
	</style>
</head> <!--final de cabeza-->

<body style="background-color: #F5F6F5">
	<header style="background-image: linear-gradient(darkred, #F5F6F5); color: black; text-align: center;">

		<h1 style="font-size: 3 em">PROFILE&nbsp;</h1>
	</header>
	<nav style="text-align: center; margin-top: 100px">
	 <!--in order to add a hyperlink, and make an element take you to a different page when clicked, we add <a href="section"> in this case a # was used to indicate an indeterminate link-->
	<a href="index.html"><img src="imagenes/home.png" alt="icono simple de casa"/></a><!--if i wanted to add a line break, and have the next icon be in a different line, i would add a "<br>" here-->

	<a href="seccion2.html"> <img src="imagenes/explore.png" alt="icono simple de brujula"/></a>

	</nav> <!--Esta es una etiqueta, la cual indica una sección específica. En este caso, la etiqueta "nav" es común para indicar los botones basicos de navegación-->

<footer style="text-align: center; background-image: linear-gradient( #F5F6F5, darkred); margin-top: 180px; padding: 36px;"> <!--para separar un elemento del otro se usa el margin, paradarse espacio a los elementos dentro del diseño se usa el adding-->

</footer>

	

	
</body>
</html> <!--indica el final del documento con /-->
